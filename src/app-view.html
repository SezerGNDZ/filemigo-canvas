<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filemigo · Interactive diagram</title><style>
:root{font:14px system-ui,sans-serif;color:#322834;background:#fcfafc;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:20px;font-weight:800}.brand span{color:#b84970}h1{font-size:17px;margin:10px 0 5px}p{color:#68566a;line-height:1.5}button,select,textarea{font:inherit;border:1px solid #ddcfdd;background:white;color:inherit;border-radius:8px;padding:9px 12px}button{cursor:pointer}button:hover{background:#faeaf1}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b84970;outline-offset:2px}.primary{background:#8d3f6f;color:white}.toolbar,.downloads{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.viewport{height:400px;overflow:auto;border:1px solid #e6dbe5;border-radius:12px;background:white;touch-action:none}.diagram{min-width:100%;padding:16px}.diagram svg{display:block;max-width:none;margin:auto}[data-selected="true"]{filter:drop-shadow(0 0 2px #b84970)}#editor{padding:12px;background:#f8f0f5;border-radius:10px;margin-top:12px}textarea{display:block;width:100%;height:90px;margin:8px 0}#incoming{background:#fff5d8;padding:12px;border-radius:10px}#status{min-height:22px;font-size:13px}#warnings{padding-left:20px;color:#844320}#summary,#stats{font-size:12px}details{margin:12px 0}summary{cursor:pointer}@media(max-width:500px){body{padding:10px}header{align-items:flex-start}.viewport{height:320px}}
</style></head><body><header><div class="brand">Filemigo<span>.</span></div><button id="open" class="primary">Open in Filemigo ↗</button></header><h1 id="title">Your diagram</h1><p id="summary">Waiting for a diagram from your assistant…</p><div id="incoming" hidden>New AI result available. Your manual edits have not been overwritten.<div class="toolbar"><button id="replace">Use new result (undoable)</button><button id="keep">Keep my version</button></div></div><div class="toolbar"><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><select id="direction" aria-label="Layout direction"><option value="LR">Left → right</option><option value="TB">Top → bottom</option></select><button id="arrange">Auto arrange</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div><div id="viewport" class="viewport" tabindex="0" aria-label="Diagram preview; drag empty space to pan"><div id="diagram" class="diagram"></div></div><p id="stats"></p><section id="editor" hidden><label for="node-text">Selected object text</label><textarea id="node-text" maxlength="1200"></textarea><button id="apply-text">Apply text</button></section><div class="downloads"><button id="download-json">Project JSON ↓</button><button id="download-editable-svg">Editable SVG ↓</button><button id="download-drawio">draw.io ↓</button></div><details><summary>Diagram checks</summary><ul id="warnings"></ul></details><p id="status" role="status"></p><!--APP_SCRIPT--></body></html>
